schema: 1
id: tasks
name: Tasks & Action Tracking
version: 0.1.0
description: Concrete actions, priorities, due dates, and interactive task board Mini-Project.
author: OpenLia maintainers
license: MIT
requires:
  core_domains:
    - inbox
  features: []
  tools: []
domains:
  - path: tasks
    kind: extension
    label: Tasks
    purpose: Concrete physical actions with priorities, due dates, and context tags.
    lifecycle: open -> in_progress -> done -> archived
    route: task
    tags:
      - task
      - productivity
    template: tasks/task-template.md
    include_in_briefing: true
    briefing_category: tasks
    feature: tasks
skills: []
policy:
  allowed_domains:
    - tasks
  allowed_actions:
    - create_records
    - update_records
    - archive_records
