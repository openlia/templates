schema: 1
id: calendar
name: Calendar & Remind Scheduling
version: 0.2.0
description: Remind-backed appointments with OpenUI month, week, and event-duration timeline views, plus companion event notes.
author: OpenLia maintainers
license: MIT
requires:
  core_domains:
    - inbox
  features: []
  tools:
    - remind
domains:
  - path: calendar
    kind: extension
    label: Calendar
    purpose: Remind schedule entries (reminders.rem) and companion event notes.
    lifecycle: scheduled -> completed -> archived
    route: event
    tags:
      - calendar
      - event
      - remind
    template: calendar/event-note-template.md
    include_in_briefing: true
    briefing_category: calendar
    skills:
      - calendar
    feature: calendar
skills:
  - id: calendar
    path: skills/calendar
    workspace_domains:
      - calendar
policy:
  allowed_domains:
    - calendar
  allowed_actions:
    - create_records
    - update_records
    - archive_records
